name: Fetch IITGNAC photos (one-time)
on:
  push:
    paths: [".github/workflows/fetch-iitgnac-photos.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos from the old Google Site
        shell: bash
        run: |
          pip install -q pillow
          python3 - <<'PY'
          import re, io, urllib.request, html
          from PIL import Image
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36","Referer":"https://sites.google.com/"}
          log=[]
          page=urllib.request.urlopen(urllib.request.Request("https://sites.google.com/iitgn.ac.in/iitgnac/home",headers=UA)).read().decode("utf-8","ignore")
          urls=[]
          for u in re.findall(r'(https://(?:sites\.google\.com/sitesv-images-rt|lh\d\.googleusercontent\.com)/[^"\'\s\\)<>]+)',html.unescape(page)):
              u=u.split('=w')[0]
              if u not in urls: urls.append(u)
          log.append(f"found {len(urls)} image urls")
          slugs=["abhishek-kandoi","eepsit-tiwari","sujay-kadam","shashwat-jain","samarpita-mallick","ihsan-k","jainam-shah","hyma-balakrishnan"]
          # page order: og:image duplicate of first photo may appear; keep unique order
          for i,u in enumerate(urls):
              try:
                  data=urllib.request.urlopen(urllib.request.Request(u+"=w800",headers=UA),timeout=30).read()
                  im=Image.open(io.BytesIO(data)).convert("RGB")
                  im.thumbnail((800,800))
                  im.save(f"IITGNAC/photos/_old-{i+1}.jpg",quality=86)
                  log.append(f"ok {i+1} {im.size} {u[:90]}")
              except Exception as e:
                  log.append(f"fail {i+1} {e} {u[:90]}")
          open("IITGNAC/photos/_fetch-log.txt","w").write("\n".join(log)+"\n")
          print("\n".join(log))
          PY
      - name: Commit results and remove this workflow
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git rm -q .github/workflows/fetch-iitgnac-photos.yml
          git add IITGNAC/photos
          git commit -m "IITGNAC: photos fetched from the old Google Site"
          git push
