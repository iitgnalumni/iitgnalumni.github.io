name: Fetch IITGNAC photos (one-time)
on:
  push:
    paths: [".github/workflows/fetch-iitgnac-photos.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos from the old Google Site
        run: |
          set -e
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y imagemagick >/dev/null
          get() { curl -fsSL -A "Mozilla/5.0" -o /tmp/$1.img "$2" && convert /tmp/$1.img -auto-orient -resize "700x700>" -quality 86 IITGNAC/photos/$1.jpg && echo "ok $1"; }
